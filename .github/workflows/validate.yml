name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Validate skill and documentation
        run: python3 scripts/validate_repo.py
      - name: Validate Strategic Explainer model-forward fixtures
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
