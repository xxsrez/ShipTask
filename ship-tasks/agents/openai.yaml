interface:
  display_name: "Ship Tasks"
  short_description: "Доставить Task Manager scope до результата"
  default_prompt: "Используй $ship-tasks, чтобы создать обязательный Goal, выполнить выбранный Task Manager scope, провести targeted gate для каждой Task и периодический тщательный gate для review batch, затем довести Tasks и Goal до подтверждённого terminal outcome."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases и Tasks"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: false
