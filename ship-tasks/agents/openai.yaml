interface:
  display_name: "Ship Tasks"
  short_description: "Доставить Task Manager scope до результата"
  default_prompt: "Используй $ship-tasks, чтобы автономно выполнить выбранный Task Manager scope под обязательным Goal: никогда не проси ручную приёмку, считай historical acceptance context superseded, перед Done обязательно публикуй и перечитывай понятный native COMPLETED report, defer-ь task-local blockers с BLOCKED report, выпускай в verified non-production environments и не релизь production без explicit user approval."

dependencies:
  tools:
    - type: "mcp"
      value: "task-manager"
      description: "Task Manager Projects, Releases и Tasks"
      transport: "streamable_http"

policy:
  allow_implicit_invocation: false
